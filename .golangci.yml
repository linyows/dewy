version: "2"
run:
  # Report paths relative to the directory golangci-lint runs in. The sock
  # module is linted from its own directory with this config, and reviewdog
  # adds that directory to each path, so paths relative to this file would
  # name sock twice.
  relative-path-mode: wd
linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
        text: "G101:"
        path: "_test\\.go$"
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
