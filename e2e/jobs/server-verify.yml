name: Server Verify

steps:
- name: Wait for new version to start
  uses: file
  retry:
    max_attempts: 60
    interval: 5s
  with:
    path: "{{ vars.log }}"
  test: |
    any(lines(res.content), # contains "starting version" && # contains replace(vars.new_version, 'v', ''))
- name: Wait for stabilization
  wait: 30s
  uses: shell
  with:
    cmd: "echo 'Waiting for system stabilization after new version detection'"
  test: status == 0
- name: Verify server telemetry metrics
  id: metrics
  # Only the telemetry-enabled server variant passes metrics_port; others skip.
  skipif: "!('metrics_port' in vars)"
  uses: http
  with:
    get: "http://localhost:{{ vars.metrics_port }}/metrics"
  # A 200 proves /metrics is served in server mode (a path that only exists when
  # telemetry is enabled). The command="server" deployment series and the
  # reason="deploy" restart confirm the server-mode deployment/restart recording
  # end-to-end. The signal-restart path is covered by unit tests, not here.
  test: |
    res.code == 200 &&
    res.body contains "dewy_deployments_total{" &&
    res.body contains "command=\"server\"" &&
    res.body contains "dewy_server_restarts_total{" &&
    res.body contains "reason=\"deploy\""
  echo: |
    {{ join(filter(split(res.body, "\n"), hasPrefix(#, "dewy_")), "\n") }}
- name: Stop dewy
  uses: shell
  with: # Use Process Group ID
    cmd: "kill -TERM -{{ vars.pid }}"
  test: status == 0
- name: Verify no error
  id: noerr
  uses: file
  with:
    path: "{{ vars.log }}"
  # Match only level=ERROR. Matching "error" case-insensitively would also
  # match the `error="..."` slog field used by INFO/WARN log lines, which
  # produced false positives for benign warnings (e.g. registry-cache
  # fail-open).
  test: res.exists && !(res.content contains "level=ERROR")
  outputs:
    ok: res.exists && !(res.content contains "level=ERROR")
- name: Verify two symlinks creates
  id: twosyml
  uses: file
  with:
    path: "{{ vars.log }}"
  test: 'count(lines(res.content), # contains "Create symlink") == 2'
  outputs:
    ok: 'count(lines(res.content), # contains "Create symlink") == 2'
- name: Verify starting two version
  id: twover
  uses: file
  with:
    path: "{{ vars.log }}"
  test: 'count(lines(res.content), # contains "starting version") in [2, 3]'
  outputs:
    ok: 'count(lines(res.content), # contains "starting version") in [2, 3]'
- name: Verify starting new version
  id: newver
  uses: file
  with:
    path: "{{ vars.log }}"
  test: |
    any(lines(res.content), # contains "starting version" && # contains replace(vars.new_version, 'v', ''))
  outputs:
    ok: |
      any(lines(res.content), # contains "starting version" && # contains replace(vars.new_version, 'v', ''))
- name: Show log
  skipif: outputs.noerr.ok && outputs.twosyml.ok && outputs.twover.ok && outputs.newver.ok
  uses: file
  with:
    path: "{{ vars.log }}"
  echo: "{{ res.content }}"
