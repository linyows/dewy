name: Assets Verify

steps:
- name: Wait for new version download
  uses: file
  retry:
    max_attempts: 60
    interval: 5s
  with:
    path: "{{ vars.log }}"
  test: |
    any(lines(res.content), # contains "Download notification" && # contains replace(vars.new_version, 'v', ''))
- name: Wait for stabilization
  wait: 30s
  uses: shell
  with:
    cmd: "echo 'Waiting for system stabilization after new version detection'"
  test: status == 0
- name: Stop dewy
  uses: shell
  with: # Use Process Group ID
    cmd: "kill -TERM -{{ vars.pid }}"
  test: status == 0
- name: Verify no error
  id: noerr
  uses: file
  with:
    path: "{{ vars.log }}"
  # Match only level=ERROR (consistent with server-verify.yml).
  test: res.exists && !(res.content contains "level=ERROR")
  outputs:
    ok: res.exists && !(res.content contains "level=ERROR")
- name: Verify two symlinks creates
  id: twosyml
  uses: file
  with:
    path: "{{ vars.log }}"
  test: 'count(lines(res.content), # contains "Create symlink") == 2'
  outputs:
    ok: 'count(lines(res.content), # contains "Create symlink") == 2'
- name: Verify starting two version
  id: twover
  uses: file
  with:
    path: "{{ vars.log }}"
  test: 'count(lines(res.content), # contains "Download notification") == 2'
  outputs:
    ok: 'count(lines(res.content), # contains "Download notification") == 2'
- name: Verify starting new version
  id: newver
  uses: file
  with:
    path: "{{ vars.log }}"
  test: |
    any(lines(res.content), # contains "Download notification" && # contains replace(vars.new_version, 'v', ''))
  outputs:
    ok: |
      any(lines(res.content), # contains "Download notification" && # contains replace(vars.new_version, 'v', ''))
- name: Show log
  skipif: outputs.noerr.ok && outputs.twosyml.ok && outputs.twover.ok && outputs.newver.ok
  uses: file
  with:
    path: "{{ vars.log }}"
  echo: "{{ res.content }}"
