name: Assets Slot Verify

# The start step already waited for "Create symlink", so the slot's version
# has been deployed. What is left to check is that the deploy was reported to
# the slot's own version directory, exactly once. If an instance deployed the
# other slot's version, that directory would hold two assets audit files and
# this slot's directory none.
#
# The server instances of the same slot report to the same directory. Audit
# file names carry the command (shipped_to_<host>_<command>_at_<time>.txt), so
# only the assets ones are counted here.
steps:
- name: Wait for the audit file
  uses: shell
  retry:
    max_attempts: 12
    interval: 5s
  with:
    cmd: |
      {{ vars.ls_cmd }} | grep -q 'shipped_to_.*_assets_at_'
  test: status == 0
- name: Stop dewy
  uses: shell
  with: # Use Process Group ID
    cmd: "kill -TERM -{{ vars.pid }}"
  test: status == 0
- name: Verify one audit file in the slot directory
  id: oneaudit
  uses: shell
  with:
    cmd: |
      {{ vars.ls_cmd }} | grep -c 'shipped_to_.*_assets_at_' | tr -d '\n'
  test: res.stdout == "1"
  outputs:
    ok: res.stdout == "1"
- name: Verify no error
  id: noerr
  uses: shell
  with:
    cmd: "grep 'level=ERROR' {{ vars.log }}"
  test: status == 1
  outputs:
    ok: status == 1
- name: Verify one symlink created
  id: onesyml
  uses: shell
  with:
    cmd: |
      grep -c 'Create symlink' {{ vars.log }} | tr -d '\n'
  test: res.stdout == "1"
  outputs:
    ok: res.stdout == "1"
- name: Show log
  skipif: outputs.oneaudit.ok && outputs.noerr.ok && outputs.onesyml.ok
  uses: shell
  with:
    cmd: "cat {{ vars.log }}"
  echo: "{{ res.stdout }}"
