name: Container Verify

steps:
- name: Wait for new version to start
  uses: shell
  retry:
    max_attempts: 180
    interval: 5s
  with:
    cmd: |
      if [ -f "{{ vars.log }}" ]; then
        grep "Starting new container" "{{ vars.log }}" | \
          grep -q "{{ vars.new_version }}" && exit 0
      fi
      exit 1
  test: status == 0

- name: Wait for stabilization
  wait: 60s
  uses: shell
  with:
    cmd: "echo 'Waiting for system stabilization after new version detection'"
  test: status == 0

- name: Verify containers are not running as root
  id: notroot
  uses: shell
  with:
    cmd: |
      runtime="{{ vars.runtime ?? 'docker' }}"
      # Podman runs rootless by default; skip the check.
      if [ "$runtime" = "podman" ]; then
        echo "Skipping non-root check on podman (rootless by default)"
        exit 0
      fi
      # Get all container IDs managed by dewy
      containers=$($runtime ps --filter "label=dewy.managed=true" -q)
      if [ -z "$containers" ]; then
        echo "No dewy-managed containers found"
        exit 1
      fi
      # Check each container's process user
      for cid in $containers; do
        uid=$($runtime top "$cid" -o uid | tail -n +2 | head -1 | tr -d ' ')
        if [ "$uid" = "0" ]; then
          echo "Container $cid is running as root (UID=0)"
          exit 1
        fi
        echo "Container $cid is running as UID=$uid (not root)"
      done
      echo "All containers are running as non-root user"
  test: status == 0
  outputs:
    ok: status == 0

- name: Verify container telemetry metrics
  id: metrics
  # Only the telemetry-enabled variant passes metrics_port; others skip.
  skipif: "!('metrics_port' in vars)"
  uses: http
  with:
    get: "http://localhost:{{ vars.metrics_port }}/metrics"
  # A 200 with the dewy_container_* series proves the observable gauges are
  # populated from a live container inspect (not deploy-time deltas). The
  # running-status series confirms state semantics against the real runtime;
  # exact value mapping is covered by unit tests.
  test: |
    res.code == 200 &&
    res.body contains "dewy_container_desired_replicas{" &&
    res.body contains "dewy_container_replicas{" &&
    res.body contains "dewy_container_info{" &&
    res.body contains "dewy_container_restarts{" &&
    res.body contains "state=\"running\"} 1"
  echo: |
    {{ join(filter(split(res.body, "\n"), hasPrefix(#, "dewy_container")), "\n") }}

# --drain-time was parsed and stored but never read until it was rewired, so
# the window below is the only thing that distinguishes a configured drain from
# the hardcoded fallback. Stop logs the duration it was handed, which makes the
# wiring directly observable.
- name: Verify --drain-time is used when replacing old containers
  id: drain
  # Only the variant that passes --drain-time checks it.
  skipif: "!('drain_time' in vars)"
  uses: shell
  with:
    # The three old replicas are stopped once the new version is healthy and
    # their backends have been pulled from the proxy. Counting via the shell
    # exit code rather than probe's stdout avoids the empty-stdout flake that
    # bites `grep -c` here.
    cmd: |
      n=$(grep -c 'Stopping container gracefully.*timeout={{ vars.drain_time }}s' \
        "{{ vars.log }}" 2>/dev/null || true)
      echo "stops at the configured drain window: $n"
      [ "$n" = "3" ]
  test: status == 0
  outputs:
    ok: status == 0

- name: Stop dewy
  uses: shell
  with: # Use Process Group ID
    cmd: "kill -TERM -{{ vars.pid }}"
  test: status == 0

# Shutdown deliberately keeps a fixed 10s window rather than the operator's
# drain budget, so a generous --drain-time cannot stall dewy past a service
# manager's stop timeout. Asserting it here keeps that decision from being
# quietly undone.
- name: Verify shutdown keeps the fixed stop window
  id: shutdown_drain
  skipif: "!('drain_time' in vars)"
  uses: shell
  retry:
    max_attempts: 30
    interval: 2s
  with:
    cmd: |
      n=$(grep -c 'Stopping container gracefully.*timeout=10s' \
        "{{ vars.log }}" 2>/dev/null || true)
      echo "stops at the fixed shutdown window: $n"
      [ "$n" = "3" ]
  test: status == 0
  outputs:
    ok: status == 0

- name: Verify no error
  id: noerr
  uses: shell
  with:
    cmd: "grep 'level=ERROR' {{ vars.log }} | grep -v 'context deadline exceeded' | grep -v 'status 429'"
  test: status == 1
  outputs:
    ok: status == 1

- name: Verify current 3 containers creates
  id: cver
  uses: shell
  with:
    cmd: |
      grep 'Starting new container' {{ vars.log }} | \
        grep -vc {{ vars.new_version }} | tr -d '\n'
  test: res.stdout == "3"
  outputs:
    ok: res.stdout == "3"

- name: Verify new 3 containers creates
  id: nver
  uses: shell
  with:
    cmd: |
      grep 'Starting new container' {{ vars.log }} | \
        grep -c {{ vars.new_version }} | tr -d '\n'
  test: res.stdout == "3"
  outputs:
    ok: res.stdout == "3"

- name: Show log
  skipif: outputs.noerr.ok && outputs.notroot.ok && outputs.cver.ok && outputs.nver.ok
  uses: shell
  with:
    cmd: "cat {{ vars.log }}"
  echo: "{{ res.stdout }}"
